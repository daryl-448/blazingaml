# Semantic profile, clean family (SPEC v3 §3.6, E16's Q8 variant): clean_e16 with fan and degree
# as v1's histograms (D-9 bins, min size 2) instead of count blocks (Q8). With `--quirks all` its
# rows are v1_e16's, plus sg_ord (SPEC v3 F6). 86 pattern columns and 52 vertex-statistics columns.
version: 2
profile: clean_e16_q8
family: clean
visibility: timestamp
credit: trigger
k_max: 10
vstats: {window: 86400}
blocks:                      # output order = listed order
  fan_in:  {patterns: [clean_fan_in],  window: 86400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
  fan_out: {patterns: [clean_fan_out], window: 86400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
  deg_in:  {patterns: [clean_deg_in],  window: 86400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
  deg_out: {patterns: [clean_deg_out], window: 86400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
  sg:      {patterns: [clean_sg_gather, clean_sg_scatter], window: 21600, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20]}
  sg_ord:  {patterns: [clean_sg_ord], window: 21600, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20]}
  tcyc:    {patterns: [clean_tcyc], window: 86400, bins: [2, 3, 4, 5, 6, 7, 8, 9, 10]}
  lcyc:    {patterns: [clean_lcyc], window: 86400, bins: [2, 3, 4, 5, 6, 7, 8, 9, 10]}
