# DG-3 / S1 (SPEC v2 §8 S1, §13): the GFP batch-mode recipe G1 of the frozen DG-2 recipe
# (configs/dg2_frozen.yaml, features/dg2_R6_G1), computed by blz. W-C windows (dg2_wc.yaml) and
# D-9 bins, GFP batch mode with batches of 128 edges cut at b_fv and at the train/test boundary,
# as tools/gfp/dg2_features.py's R6 call. GFP's time_window is the largest block window
# (342,000). k_max 33 covers every tcyc cycle GFP finds on HI-Small at this window (DG-4: the
# longest has 11 edges); GFP itself has no cap. Oracle and cpu only (E404 on cuda).
version: 2
profile: dg2_g1
visibility: batch
credit: participants
batch: {size: 128, cuts: splits}
k_max: 33
blocks:
  fan_in:  {patterns: [fan_in],  window: 320400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
  fan_out: {patterns: [fan_out], window: 320400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
  deg_in:  {patterns: [deg_in],  window: 320400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
  deg_out: {patterns: [deg_out], window: 320400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
  sg:      {patterns: [sg_gather, sg_scatter], window: 342000, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20]}
  tcyc:    {patterns: [tcyc], window: 320400, bins: [2, 3, 4, 5, 6, 7, 8, 9, 10]}
