# Semantic profile, clean family (SPEC v3 §3.3): R1-R11 with the v1 windows (fan and degree 24 h,
# sg and sg_ord 6 h, tcyc 24 h), k_max 10, and v1's bins (D-9) for sg, sg_ord and tcyc. Fan and
# degree are count blocks (R7): one column each, the count. 33 columns. Every window is
# (t - delta, t] (R2) and a row sees every edge with ts <= t (R3). The regression and hillclimb
# anchor.
version: 2
profile: clean_default
family: clean
visibility: timestamp
credit: trigger
k_max: 10
blocks:                      # output order = listed order
  fan_in:  {patterns: [clean_fan_in],  window: 86400}
  fan_out: {patterns: [clean_fan_out], window: 86400}
  deg_in:  {patterns: [clean_deg_in],  window: 86400}
  deg_out: {patterns: [clean_deg_out], window: 86400}
  sg:      {patterns: [clean_sg_gather, clean_sg_scatter], window: 21600, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20]}
  sg_ord:  {patterns: [clean_sg_ord], window: 21600, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20]}
  tcyc:    {patterns: [clean_tcyc], window: 86400, bins: [2, 3, 4, 5, 6, 7, 8, 9, 10]}
