# Semantic profile (SPEC v2 §8 S4): the features of the set ops, fan_oneway_out (difference) and
# fan_total (union), at the fan window (D-8: 24 h) and the fan bins (D-9). Stream visibility,
# trigger credit. 24 columns.
version: 2
profile: fan_sets
visibility: stream
credit: trigger
k_max: 10
blocks:                      # output order = listed order
  fan_oneway_out: {patterns: [fan_oneway_out], window: 86400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
  fan_total:      {patterns: [fan_total],      window: 86400, bins: [2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 30, 50]}
