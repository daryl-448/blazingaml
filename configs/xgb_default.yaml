# XGBoost config (SPEC §10.2, D-11): library defaults, as an untuned XGBClassifier() uses them.
# params are passed verbatim to XGBoosterSetParam; nthread comes from `blz train --threads`.
# A row is predicted positive when its probability > threshold.
num_boost_round: 100
threshold: 0.5
batch_rows: 262144
params:
  objective: binary:logistic
  tree_method: hist
  max_depth: 6
  eta: 0.3
  min_child_weight: 1
  subsample: 1
  colsample_bytree: 1
  lambda: 1
  max_bin: 256
  scale_pos_weight: 1
  seed: 0
