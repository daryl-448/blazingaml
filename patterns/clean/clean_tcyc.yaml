# clean_tcyc (SPEC v3 R4): the cycles (v = c_0, c_1, ..., c_{k-1} = u) of distinct nodes, k = 2..K_MAX,
# with window edges c_{i-1} -> c_i at t_1 <= t_2 <= ... <= t_{k-1}, that the trigger u -> v closes
# as a latest edge. The visibility caps every hop at t (R3), so no hop has a `t` bound, and each
# hop binds its earliest witness at or after the previous hop. The index has no self-loops (R1), so
# C1 != V and no hop needs the filters that excluded one.
version: 1
pattern: clean_tcyc
block: tcyc
family: clean
consts: {K_MAX: 10}
window: {span: delta_cyc, lower: open}
visibility: timestamp
trigger: {edge: e0, src: U, dst: V}
constraints: [{skip_if: "U == V"}]       # a self-loop trigger's row is zero (R1)
stages:
  - id: close_2                          # the cycle V -> U -> V
    op: exists
    src: V.out
    node: U
    edge: c2
    emit: {size: 2}
  - id: hop_1                            # first hop: only the window bounds it from below
    op: for_all
    src: V.out
    edge: h1
    dst_var: C1
    constraints: [{skip_if: "C1 == U"}]
  - id: close_3
    op: exists
    src: C1.out
    node: U
    edge: c3
    constraints: [{skip_if: "c3.t < h1.t"}]
    emit: {size: 3}
  - repeat: {var: k, from: 2, to: "K_MAX - 2"}
    stages:
      - id: "hop_{k}"
        op: for_all
        src: "C{k-1}.out"
        edge: "h{k}"
        dst_var: "C{k}"
        constraints:
          - skip_if: "h{k}.t < h{k-1}.t"    # at or after the previous hop (R4)
          - skip_if: "C{k} in [U, V, C{1..k-1}]"
      - id: "close_{k+2}"
        op: exists
        src: "C{k}.out"
        node: U
        edge: "c{k+2}"
        constraints: [{skip_if: "c{k+2}.t < h{k}.t"}]
        emit: {size: "{k+2}"}
