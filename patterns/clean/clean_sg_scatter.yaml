# clean_sg_scatter (SPEC v3 R6a): the scatter role of sg. The trigger S -> X reports, for each
# sink w in N_out(X) with w != S, the pair (S, w) sized by I(S, w) = N_out(S) ∩ N_in(w) over the
# window. The index has no self-loops (R1), so w != X, and no intermediate is S or w: both
# endpoints leave I the same way in both roles, and the intersection needs no element filter.
version: 1
pattern: clean_sg_scatter
block: sg
family: clean
window: {span: delta_sg, lower: open}
visibility: timestamp
trigger: {edge: e0, src: S, dst: X}
constraints: [{skip_if: "S == X"}]       # a self-loop trigger's row is zero (R1)
stages:
  - id: sinks
    op: for_all
    src: X.out
    edge: e1
    dst_var: W
    constraints: [{skip_if: "W == S"}]
  - id: intermediates
    op: intersection
    src: S.out
    dst: W.in
    edges: [e2, e3]
    output: I
    element: Y
    emit: {size: "len(I)"}
