# clean_sg_gather (SPEC v3 R6a): the gather role of sg. The trigger X -> W reports, for each
# source s in N_in(X) with s != W, the pair (s, W) sized by I(s, W) = N_out(s) ∩ N_in(W) over the
# window. The index has no self-loops (R1), so s != X, and no intermediate is s or W: both
# endpoints leave I the same way in both roles, and the intersection needs no element filter.
version: 1
pattern: clean_sg_gather
block: sg
family: clean
window: {span: delta_sg, lower: open}
visibility: timestamp
trigger: {edge: e0, src: X, dst: W}
constraints: [{skip_if: "X == W"}]       # a self-loop trigger's row is zero (R1)
stages:
  - id: sources
    op: for_all
    src: X.in
    edge: e1
    dst_var: S
    constraints: [{skip_if: "S == W"}]
  - id: intermediates
    op: intersection
    src: S.out
    dst: W.in
    edges: [e2, e3]
    output: I
    element: Y
    emit: {size: "len(I)"}
