# clean_sg_ord (SPEC v3 R6b): ordered scatter-gather, gather edges only (R9). The trigger X -> W
# reports, for each source s in N_in(X) with s != W, the pair (s, W) sized by the intermediates y
# with window edges s -> y at t1 and y -> W at t2, t1 <= t2 (R4); X is one of them, through s -> X
# and the trigger. No time bound on the sources: the visibility caps them at t (R3). The index has
# no self-loops (R1), so s != X and no intermediate is s or W: the intersection's only constraint
# is the order.
version: 1
pattern: clean_sg_ord
block: sg_ord
family: clean
window: {span: delta_sg, lower: open}
visibility: timestamp
trigger: {edge: e0, src: X, dst: W}
constraints: [{skip_if: "X == W"}]       # a self-loop trigger's row is zero (R1)
stages:
  - id: sources
    op: for_all
    src: X.in
    edge: e1
    dst_var: S
    constraints: [{skip_if: "S == W"}]
  - id: intermediates
    op: intersection
    src: S.out
    dst: W.in
    edges: [e2, e3]
    output: I
    element: Y
    constraints:
      - skip_if: "e2.t > e3.t"           # order constraint (SPEC v2 §6.2): some s -> y at or before some y -> w
    emit: {size: "len(I)"}
