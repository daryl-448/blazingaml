# clean_deg_out (SPEC v3 R7): the window edges out of the trigger's source u, parallel edges and
# the trigger included. The index has no self-loops (R1), so no edge is u -> u and the count needs
# no element filter.
version: 1
pattern: clean_deg_out
block: deg_out
family: clean
window: {span: delta_deg, lower: open}
visibility: timestamp
trigger: {edge: e0, src: U, dst: V}
constraints: [{skip_if: "U == V"}]       # a self-loop trigger's row is zero (R1)
stages:
  - id: out_edges
    op: count
    src: U.out
    edge: e1
    element: Y
    multiplicity: edges
    output: n
    emit: {size: n}
