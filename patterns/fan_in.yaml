# fan_in (SPEC §4.3): the distinct in-neighbours x != v of the trigger's destination v, u included.
version: 1
pattern: fan_in
block: fan_in
window: {span: delta_fan, lower: open}
trigger: {edge: e0, src: U, dst: V}
constraints: [{skip_if: "U == V"}]
stages:
  - id: in_nbrs
    op: count
    src: V.in
    edge: e1
    element: X
    multiplicity: distinct
    output: n
    constraints: [{skip_if: "X == V"}]
    emit: {size: n}
