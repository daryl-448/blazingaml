# sg_gather (SPEC §4.5): the trigger is an intermediate -> sink edge (the paper's Fig. 5a role).
version: 1
pattern: sg_gather
block: sg
window: {span: delta_sg, lower: closed}
trigger: {edge: e0, src: X, dst: W}
constraints: [{skip_if: "X == W"}]
stages:
  - id: sources
    op: for_all
    src: X.in
    edge: e1
    dst_var: S
    constraints: [{skip_if: "S in [X, W]"}]
  - id: intermediates
    op: intersection
    src: S.out
    dst: W.in
    edges: [e2, e3]
    output: I
    element: Y
    constraints: [{skip_if: "Y == W"}]    # the gather role excludes the sink (§4.5)
    emit: {size: "len(I)"}
