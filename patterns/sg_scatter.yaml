# sg_scatter (SPEC §4.5): the trigger is a source -> intermediate edge (the paper's Fig. 4a role).
version: 1
pattern: sg_scatter
block: sg
window: {span: delta_sg, lower: closed}
trigger: {edge: e0, src: S, dst: X}
constraints: [{skip_if: "S == X"}]
stages:
  - id: sinks
    op: for_all
    src: X.out
    edge: e1
    dst_var: W
    constraints: [{skip_if: "W in [S, X]"}]
  - id: intermediates
    op: intersection
    src: S.out
    dst: W.in
    edges: [e2, e3]
    output: I
    element: Y
    constraints: [{skip_if: "Y == S"}]    # the scatter role excludes the source (§4.5, A30–A32)
    emit: {size: "len(I)"}
